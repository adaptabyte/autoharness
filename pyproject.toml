[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoharness"
version = "2.0.0"
description = "Any interface, compiled once by a frontier model into a plan a small open model can run on your own computer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "pillow>=10", "opencv-python-headless>=4.9", "mss>=9", "python-xlib>=0.33", "rapidocr-onnxruntime>=1.3", "playwright>=1.45", "pycryptodomex>=3.18", "pypdfium2>=4.30"]

[project.optional-dependencies]
demo = ["django>=5"]
dev = ["pytest>=8"]

[project.scripts]
autoharness = "autoharness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["autoharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
