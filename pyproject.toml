[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoharness"
version = "0.1.0"
description = "Auto-harness: a smart model explores any game, then synthesizes a fast per-game harness for a small realtime model."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
serve = ["vllm>=0.9", "huggingface-hub>=0.24"]
dev = ["pytest>=8.0"]

[project.scripts]
autoharness = "autoharness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["autoharness", "games", "webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
