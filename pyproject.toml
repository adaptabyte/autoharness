[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoharness"
version = "2.0.0"
description = "A frontier model learns any app once and builds the interface it wishes the app had. A local model runs it from then on."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "pillow>=10", "opencv-python-headless>=4.9", "mss>=9", "python-xlib>=0.33", "rapidocr-onnxruntime>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
autoharness = "autoharness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["autoharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
