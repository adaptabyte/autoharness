<style>

.drop:hover,.drop.over{border-color:var(--ok);background:var(--ok-soft)}.drop b{display:block;font-size:20px;letter-spacing:-.01em}.drop span{color:var(--muted);font-size:14.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}

    h("div",{class:"card",style:"padding:18px 20px"},h("label",{class:"hint"},"Job"),h("div",{},sel),form,h("button",{class:"btn primary",onclick:async()=>{err.textContent="";const out={};for(const[k,i]of Object.entries(inputs)){const raw=i.value.trim();try{out[k]=/^[\[{]/.test(raw)?JSON.parse(raw):raw}catch(e){out[k]=raw}}try{const j=await api("/api/ui/run",{id,skill:skill.name,inputs:out});go("job/"+j.id)}catch(e){err.textContent=e.message}}},"Run it on this computer"),p.swarm?h("button",{class:"btn",style:"margin-left:8px",onclick:async()=>{try{const j=await api("/api/ui/swarm",{id,skill:skill.name,count:p.swarm});go("swarm/"+j.id)}catch(e){err.textContent=e.message}}},`Run ${p.swarm} at once`):null,err),
    h("h2",{},"The plan"),h("p",{class:"hint",style:"margin:0 0 8px"},"Written by a model, for a model. It's data, not code."),h("div",{class:"card vals"},p.skills.map(s=>h("div",{class:"val",style:"grid-template-columns:minmax(120px,30%) minmax(0,1fr)"},h("label",{},s.name),h("span",{},s.does||"",h("span",{class:"hint"},` ${plural(s.size,"step")}`))))));

function swarmView(id){
  const v=$("#view");const head=h("h1",{},"A swarm, on one small model");const sub=h("p",{class:"hint",style:"margin:0"},"Starting...");const grid=h("div",{class:"swarm"});const cells={};const t0=Date.now();let done=0,total=0;let timer=null;

const STAGES=[["explore","Spark explores"],["compile","Wonder writes the plan"],["prove","Glimmer proves it"],["repair","Wonder repairs"],["run","Glimmer runs it"]];
