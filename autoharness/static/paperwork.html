<style>

.wrap{max-width:1120px;margin:0 auto;padding:0 24px 72px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0}

.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14.5px;margin:6px 0 12px}
.reading h1{font-size:clamp(26px,3.6vw,38px);margin:14px 0 6px}

.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.pg{padding:8px}.pg img{display:block;width:100%;aspect-ratio:8.5/11;object-fit:cover;border-radius:6px;background:#eee}.pg small{display:block;color:var(--muted);margin:6px 2px 4px;font-size:12.5px}

<body>
<div class="wrap">
<header>
  <a class="logo" onclick="go('')"><i><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Autoharness</a>

</div>
<script>
const $=s=>document.querySelector(s);

const api=async(path,body)=>{const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Something went wrong");return d};

  h("span",{class:"pill"},h("i",{class:"dot "+(net===false?"warn":"on")}),net===false?"Internet off":"Internet on"),

    h("div",{class:"row",style:"margin-bottom:12px"},h("span",{class:"hint"},"This stack is a"),select,h("button",{class:"btn small",onclick:teachDialog},"Teach a new kind")),
    drop,err,

    h("div",{class:"how"},
      h("div",{},h("h3",{},"A frontier model designs the team, once"),h("p",{},"Muse Wonder sees a blank form and writes who reads what, and which checks apply."),h("em",{class:"tag-cloud"},"Cloud, one time, about $0.10")),
      h("div",{},h("h3",{},"Local models read every page"),h("p",{},"Several copies of Muse Glimmer read each page with different jobs, on your own GPU."),h("em",{class:"tag-local"},"This computer, no cloud")),
      h("div",{},h("h3",{},"Code decides what you must see"),h("p",{},"A value needs two reads and no contradiction. Otherwise it comes to you, side by side."),h("em",{class:"tag-local"},"Plain code, no model"))),

function proofTable(p){return h("div",{class:"proof"},h("h2",{style:"margin-bottom:8px"},p.title),h("div",{class:"card scroll"},h("table",{},h("thead",{},h("tr",{},p.columns.map(c=>h("th",{},c)))),h("tbody",{},p.rows.map((r,i)=>h("tr",{},r.map(c=>h("td",{class:i===p.highlight?"us":null},c))))))),h("p",{class:"hint"},p.note))}

function teachDialog(){
  const err=h("div",{class:"error"});let files=[];
  const note=h("input",{type:"text",placeholder:"Optional: what should it care about?"});
  const go2=h("button",{class:"btn primary",disabled:true,onclick:async()=>{err.textContent="";go2.disabled=true;go2.textContent="Muse Wonder is designing the team...";try{const paths=[];for(const f of files){const r=await fetch("/api/upload?name="+encodeURIComponent(f.name),{method:"POST",body:f});const d=await r.json();if(!r.ok)throw new Error(d.error);paths.push(d.path)}const j=await api("/api/team/design",{files:paths,note:note.value});watchDesign(j.id,m,body)}catch(e){err.textContent=e.message;go2.disabled=false;go2.textContent="Design the team"}}},"Design the team");
  const input=h("input",{type:"file",multiple:true,accept:"image/*,.pdf",onchange:e=>{files=[...e.target.files];go2.disabled=!files.length}});
  const body=h("div",{},h("h3",{},"Teach a new kind of paperwork"),h("p",{class:"hint",style:"margin:0 0 12px"},"Add a blank form or a made-up example. It's the one step that uses the cloud: these pages go to Meta's API, so don't use real records. After this, reading stays on this computer."),input,h("div",{style:"margin:12px 0"},note),h("div",{class:"row"},go2,h("button",{class:"btn",onclick:()=>m.remove()},"Cancel")),err);

function watchDesign(id,m,body){const es=new EventSource(`/api/jobs/${id}/events`);es.onmessage=async ev=>{const e=JSON.parse(ev.data);if(e.type==="plan"){await loadState();body.replaceChildren(h("h3",{},`Team ready: ${e.plan.name}`),h("p",{class:"hint"},`Designed by ${e.plan.designed_by||"Muse Wonder"} for $${e.plan.cost.usd.toFixed(3)}. From here on, no cloud.`),h("b",{},"Readers"),h("ul",{style:"margin:4px 0 10px"},e.plan.readers.map(r=>h("li",{},r))),h("b",{},"What it reads"),h("p",{style:"margin:2px 0 14px",class:"hint"},e.plan.fields.join(", ")),h("button",{class:"btn primary",onclick:()=>{m.remove();home()}},"Use this team"))}if(e.type==="error"){body.append(h("div",{class:"error"},e.text))}if(e.type==="end")es.close()}}

function reading(jobId){
  const v=$("#view");const clock=h("span",{},"0 s");const bar=h("i");const grid=h("div",{class:"pages"});const title=h("h1",{},"Reading");const sub=h("p",{class:"hint",style:"margin:0"},"Starting...");

      grid.replaceChildren(...Array.from({length:e.pages},(_,i)=>{const chips=e.readers.map(r=>{const c=h("span",{class:"rd"},r);cells[i+"|"+r]=c;return c});return h("div",{class:"card pg"},h("img",{src:`/api/team/stack/${e.stack}/page/${i}`,alt:`Page ${i+1}`}),h("small",{},`Page ${i+1}`),h("div",{class:"readers"},chips))}))}

}

const ISSUE_TEXT={conflict:"The readings disagree.",identity:"The pages disagree about who this is. One of these is wrong.",unconfirmed:"Only one read saw this, so it isn't confirmed.",missing:"Nobody found this in the stack.",not_allowed:"This isn't one of the allowed values.",unreadable:"This can't be understood as written, so it can't be checked."};
