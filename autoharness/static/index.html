<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoharness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2334d399'/%3E%3Cpath d='M9 22l7-13 7 13' stroke='%2306130d' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0e11;--panel:#14171c;--panel-2:#1b1f26;--line:#262b33;
  --text:#eef0f3;--muted:#99a1ad;--faint:#6c7480;
  --paid:#fbbf24;--paid-soft:rgba(251,191,36,.12);
  --free:#34d399;--free-soft:rgba(52,211,153,.12);
  --glimmer:#a78bfa;--glimmer-soft:rgba(167,139,250,.14);
  --bad:#f87171;--bad-soft:rgba(248,113,113,.12);
  --radius:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:24px;height:24px;border-radius:7px;background:var(--free);display:grid;place-items:center}
.logo svg{width:14px;height:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--free)}.dot.off{background:var(--bad)}.dot.warn{background:var(--paid)}

h1{font-size:clamp(38px,6.4vw,68px);line-height:1.04;letter-spacing:-.035em;margin:44px 0 16px;font-weight:750;max-width:14em}
.lede{font-size:clamp(18px,2.2vw,22px);color:var(--muted);max-width:40em;margin:0 0 36px}
.lede b{color:var(--text);font-weight:600}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:44px}
.how>div{background:var(--panel);padding:20px 22px}
.how .n{font-size:13px;color:var(--faint);margin-bottom:6px}
.how h3{margin:0 0 4px;font-size:18px;font-weight:650;letter-spacing:-.01em}
.how p{margin:0;color:var(--muted);font-size:14.5px}
.how .tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:6px}
.tag.paid{color:var(--paid);background:var(--paid-soft)}
.tag.free{color:var(--free);background:var(--free-soft)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
h2{font-size:22px;letter-spacing:-.015em;margin:0 0 14px;font-weight:680}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:0}
input[type=text]:focus,textarea:focus{border-color:var(--free)}
textarea{resize:vertical;min-height:74px}
.field{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.chip:hover,.chip.sel{color:var(--text);border-color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--free);color:#06130d;border-color:var(--free)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.hint{font-size:13.5px;color:var(--faint)}
.error{color:var(--bad);font-size:14px;margin-top:10px}

section{margin-bottom:48px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.app{display:flex;flex-direction:column;gap:12px;text-decoration:none;transition:border-color .15s}
.app:hover{border-color:var(--faint)}
.app h3{margin:0;font-size:18px;font-weight:650}
.app .goal{color:var(--muted);font-size:14px;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num small{display:block;color:var(--faint);font-size:12.5px}
.num b{font-size:21px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.paid{color:var(--paid)}.free{color:var(--free)}.gl{color:var(--glimmer)}
.badge{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--free);background:var(--free-soft)}.badge.bad{color:var(--bad);background:var(--bad-soft)}.badge.busy{color:var(--paid);background:var(--paid-soft)}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}

.title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:14px 0 18px}
.title h1{font-size:clamp(26px,3.6vw,38px);margin:0;letter-spacing:-.025em}
.title p{margin:4px 0 0;color:var(--muted);max-width:52em}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.screen{position:relative;background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;aspect-ratio:16/10}
.screen img{width:100%;height:100%;display:block;object-fit:contain}
.screen .tagline{position:absolute;left:10px;top:10px;font-size:12.5px;padding:3px 9px;border-radius:7px;background:rgba(12,14,17,.8);backdrop-filter:blur(6px);display:flex;gap:7px;align-items:center}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.meter{padding:18px 20px}
.meter small{color:var(--muted);font-size:13.5px;display:block}
.meter .big{font-size:50px;line-height:1.1;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.meter .sub{font-size:13.5px;color:var(--faint);margin-top:2px}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:9px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--faint);font-size:14px;display:flex;gap:8px;align-items:center}
.step.now{color:var(--text);border-color:var(--paid);background:var(--paid-soft)}
.step.past{color:var(--free)}
.ladder{padding:8px}
.tier{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;transition:background .2s}
.tier .ico{width:10px;height:10px;border-radius:50%;flex:none;background:var(--faint)}
.tier b{font-weight:620;font-size:15px}
.tier small{display:block;color:var(--faint);font-size:12.5px;line-height:1.3}
.tier .ct{margin-left:auto;font-size:18px;font-weight:680;font-variant-numeric:tabular-nums}
.tier.code .ico{background:var(--free)}.tier.glimmer .ico{background:var(--glimmer)}.tier.cloud .ico{background:var(--paid)}
.tier.code.on{background:var(--free-soft)}.tier.glimmer.on{background:var(--glimmer-soft)}.tier.cloud.on{background:var(--paid-soft)}
.feed{max-height:330px;overflow:auto;padding:6px 14px;font-size:14px;overscroll-behavior:contain}
.feed div{padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.feed div:last-child{border-bottom:0}
.feed .spark{color:var(--text)}.feed .pass{color:var(--free)}.feed .fail{color:var(--bad)}.feed .gl{color:var(--glimmer)}.feed .paidline{color:var(--paid)}
.result{margin-bottom:14px;padding:18px 22px;border-radius:var(--radius);border:1px solid var(--free);background:var(--free-soft)}
.result.bad{border-color:var(--bad);background:var(--bad-soft)}
.result h3{margin:0 0 4px;font-size:20px}
.result p{margin:0 0 12px;color:var(--muted)}
.race{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lane .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.lane h3{margin:0;font-size:18px}
.scoreline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.scoreline .card{padding:14px 16px}
.scoreline .big{font-size:38px;font-weight:720;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.scoreline small{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.stats>div{background:var(--panel);padding:16px 18px}
.stats small{display:block;color:var(--muted);font-size:13px}
.stats b{font-size:27px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stats em{display:block;font-style:normal;color:var(--faint);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--free)}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:560px;font:12.5px/1.55 var(--mono);margin:0;white-space:pre}
.prose{white-space:pre-wrap;color:var(--muted);font-size:15px;max-width:58em;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;text-align:left;color:var(--faint);padding:6px 10px 6px 0}
td{padding:7px 10px 7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14.5px;color:var(--muted)}
.seen{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.seen h3{margin:0 0 8px;font-size:15px;font-weight:620;color:var(--muted)}
.state{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;margin:0}
.verb{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.verb:first-child{border-top:0}
.verb code{font:13px var(--mono);color:var(--free)}
.verb span{display:block;color:var(--faint);font-size:13px}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.vs .card{padding:12px 14px}
.vs b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.vs small{color:var(--muted);font-size:12.5px}
@media (max-width:900px){.seen{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:480px;width:100%}
footer{padding:24px 0 40px;color:var(--faint);font-size:13.5px}
@media (max-width:900px){
  .wrap{padding:0 16px}
  .stage{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .race{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .meter .big{font-size:42px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#/"><i><svg viewBox="0 0 32 32"><path d="M7 25l9-18 9 18" stroke="#06130d" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Autoharness</a>
    <div class="pills" id="pills"></div>
  </header>
  <main id="view"></main>
  <footer>For the models, by the models. Learns with Muse Spark and SAM 3.1. Runs on Muse Glimmer, on your machine.</footer>
</div>
<div id="modal"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c===null||c===undefined||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const fill=(el,...kids)=>el.replaceChildren(...kids.flat().filter(x=>x!==null&&x!==undefined&&x!==false));
const usd=(v,d)=>{v=+v||0;if(d===undefined)d=v>=10?2:v>=0.1?2:v===0?2:3;return"$"+v.toFixed(d)};
const secs=v=>{if(v===null||v===undefined)return"—";v=+v;if(v<10)return v.toFixed(1)+" s";if(v<90)return Math.round(v)+" s";if(v<3600)return Math.round(v/60)+" min";return(v/3600).toFixed(1)+" h"};
const bytes=v=>{v=+v||0;if(v<1024)return v+" bytes";if(v<1048576)return(v/1024).toFixed(0)+" KB";return(v/1048576).toFixed(1)+" MB"};
const api=async(path,body)=>{const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d};
let S={library:[],catalog:[],jobs:[]};let cleanup=null;

function renderPills(){
  const net=S.internet;const pills=$("#pills");pills.replaceChildren(
    h("span",{class:"pill"},h("i",{class:"dot "+(net===null||net===undefined?"":net?"on":"off")}),net===false?"Internet off":"Internet on"),
    h("span",{class:"pill",title:"Muse Glimmer, the local model"},h("i",{class:"dot "+(S.glimmer?"on":"warn")}),S.glimmer?"Glimmer ready":"Glimmer offline"),
    h("span",{class:"pill",title:"Total spent on the Meta API through this install"},usd(S.spent_usd,2)+" of "+usd(S.budget_usd,0)));
}
async function refresh(){try{S=await api("/api/state");renderPills()}catch(e){}return S}
setInterval(refresh,2500);

/* ---------- home ---------- */
function statusBadge(a){
  if(a.status==="ready")return h("span",{class:"badge ok"},"Ready");
  if(a.status==="teaching")return h("span",{class:"badge busy"},"Learning");
  return h("span",{class:"badge bad"},a.status==="stopped"?"Stopped":"Failed");
}
function appCard(a){
  const cost=a.runs?a.repair_usd/a.runs:null;
  return h("a",{class:"card app",href:"#/app/"+a.id},
    h("div",{class:"row spread"},h("h3",{},a.name),statusBadge(a)),
    h("p",{class:"goal"},a.goal),
    a.status!=="ready"?h("div",{class:"hint"},a.status==="teaching"?"Spark is learning this now.":`Spent ${usd(a.teach_usd)} before stopping.`):
    h("div",{class:"nums"},
      h("div",{class:"num"},h("small",{},"Taught once for"),h("b",{class:"paid"},usd(a.teach_usd))),
      h("div",{class:"num"},h("small",{},"Each run after that"),h("b",{class:"free"},cost===null?"—":usd(cost,2))),
      h("div",{class:"num"},h("small",{},"Typical run"),h("b",{},secs(a.median_seconds))),
      h("div",{class:"num"},h("small",{},"Succeeded"),h("b",{},a.attempted?a.successes+" of "+a.attempted:"—"))));
}
function viewHome(){
  const v=$("#view");
  const targetIn=h("input",{type:"text",id:"tg",placeholder:"A website, a program, or pick one below",autocomplete:"off"});
  const goalIn=h("textarea",{id:"gl",placeholder:"Win a game. Add a patient from this referral. Export last month's invoices."});
  const err=h("div",{class:"error"});
  const chips=h("div",{class:"chips"},S.catalog.map(c=>h("span",{class:"chip",onclick:()=>{targetIn.value=c.id;targetIn.dataset.name=c.name;goalIn.value=c.suggested_goal||"";[...chips.children].forEach(x=>x.classList.remove("sel"));event.target.classList.add("sel")}},c.name)));
  const go=h("button",{class:"btn primary",onclick:async()=>{err.textContent="";go.disabled=true;try{const j=await api("/api/teach",{target:targetIn.value,goal:goalIn.value});location.hash="#/job/"+j.id}catch(e){err.textContent=e.message;go.disabled=false}}},"Teach it");
  const running=S.jobs.filter(j=>j.status==="running");
  fill(v,
    h("h1",{},"Stop paying a genius to click buttons."),
    h("p",{class:"lede"},"Every app on earth was built for human eyes and hands, and today's agents pay a frontier model to squint at screenshots of them. Autoharness has the model ",h("b",{},"learn an app once and build the interface it wishes the app had."),"  After that the app runs on your computer, for free, with your data on your machine."),
    h("div",{class:"how"},
      h("div",{},h("div",{class:"n"},"First, once"),h("h3",{},"Spark learns the app"),h("p",{},"No instructions and no API. It uses the app the way a person would, and works out how it behaves."),h("span",{class:"tag paid"},"Cloud, pennies to dollars")),
      h("div",{},h("div",{class:"n"},"Still once"),h("h3",{},"It builds its own interface"),h("p",{},"Spark writes a program that gives any model the app as plain state and typed actions, tests it on fresh copies, and has to prove it works."),h("span",{class:"tag paid"},"Cloud, included above")),
      h("div",{},h("div",{class:"n"},"Every time after"),h("h3",{},"Your computer does the work"),h("p",{},"Code does the routine steps. Glimmer, a small local model, makes the calls, without ever seeing a screen. Pull the internet cable and it keeps going."),h("span",{class:"tag free"},"Local, $0.00 per run"))),
    running.length?h("section",{},h("h2",{},"Happening now"),h("div",{class:"lib"},running.map(j=>h("a",{class:"card app",href:"#/job/"+j.id},h("div",{class:"row spread"},h("h3",{},j.title),h("span",{class:"badge busy"},"Live")))))):null,
    h("section",{},h("h2",{},"Teach it something new"),h("div",{class:"card"},
      h("div",{class:"field"},h("label",{for:"tg"},"What should it learn?"),targetIn,chips),
      h("div",{class:"field"},h("label",{for:"gl"},"What should it do?"),goalIn),
      h("div",{class:"row spread"},h("span",{class:"hint"},"Spark is paid by the token. It stops at $4 no matter what."),go),err)),
    h("section",{},h("div",{class:"row spread"},h("h2",{},"What it already knows"),
      h("label",{class:"btn",style:"margin:0;color:var(--text);font-size:14px;padding:6px 12px"},"Import a .harness file",h("input",{type:"file",accept:".harness",hidden:true,onchange:async e=>{const f=e.target.files[0];if(!f)return;const r=await fetch("/api/import",{method:"POST",body:f});const d=await r.json();if(d.id)location.hash="#/app/"+d.id}}))),
      S.library.length?h("div",{class:"lib"},S.library.map(appCard)):h("div",{class:"empty"},"Nothing yet. Teach it its first app above.")));
}

/* ---------- shared live bits ---------- */
function liveScreen(job,lane,label,tone){
  const img=h("img",{src:`/api/jobs/${job}/live/${lane}`,alt:"Live view of the app"});
  return h("div",{class:"screen"},img,label?h("div",{class:"tagline"},h("i",{class:"dot "+tone}),label):null);
}
function feedLine(e){
  const s=(t,c)=>h("div",{class:c||""},t);
  const names={segment:"Asking SAM 3.1 to locate things",view_frame:"Inspecting a screenshot closely",experiment:"Testing some vision code on a recording",save_template:"Saving a picture to recognize later",write_harness:"Writing the program",trial:"Testing the program"};
  switch(e.type){
    case"say":return s(e.text,"spark");
    case"note":return s("Learned: "+e.text);
    case"understanding":return s("Understands the app now.","pass");
    case"segment":return s(`SAM 3.1 found ${e.count} × "${e.phrase}"`);
    case"tool":return names[e.name]&&e.name!=="segment"&&e.name!=="write_harness"&&e.name!=="trial"?s(names[e.name]):null;
    case"template":return s(`Saved a picture of "${e.name}"`);
    case"code":return s(`Wrote version ${e.version} of the program, ${e.lines} lines`);
    case"trial_start":return s("Testing it on a fresh copy of the app…");
    case"trial_end":return e.status==="done"?s(`Test passed in ${secs(e.seconds)}, ${e.actions} actions`,"pass"):s(`Test failed: ${e.reason||e.status}`,"fail");
    case"verify_start":return s(`Proof run ${e.n} of ${e.of}. No cloud help allowed.`);
    case"verify_end":return s(`Proof run ${e.n}: ${e.ok?"passed":"failed"} in ${secs(e.seconds)}. Judge: ${e.why||"—"}`,e.ok?"pass":"fail");
    case"log":return e.tier==="person"?s(e.text,"pass"):s(e.text);
    case"ask":return s("Glimmer, asked: "+e.text,"gl");
    case"answer":return s(`Glimmer answered in ${e.seconds} s: ${e.text}`,"gl");
